<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS od podstaw</title>
  <link rel="stylesheet" href="src/css/styles.css">
</head>
<body>
  <h2>Koszyk</h2>

  <table class="card-table">
    <thead>
      <tr>
        <th>Lp</th>
        <th>Model</th>
        <th>Rozmiar</th>
        <th>Ilość</th>
        <th>Cena</th>
      </tr>
    </thead>
    <tbody id="items">
    </tbody>
    <tfooter>
      <tr>
        <td colspan="4" style="text-align: right;"><b>Razem:</b></td>
        <td><b id="total-price"></b></td>
      </tr>
    </tfooter>
  </table>

  <label class="add-discount"><input id="add-discount" type="checkbox">Zastosuj zniżkę</label>
  

  <p class="discount hidden" id="discount" data-discount-should-be-enabled="1">Zniżka: <b id="discount-amount">0</b> zł</p>

  <script src="src/js/app.js"></script>
</body>
</html>
