<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS od podstaw</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="src/css/styles.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
    <div class="navbar-nav">
      <a class="nav-item nav-link active" href="index.html">Strona główna</a>
      <a class="nav-item nav-link" href="koszyk.html">Koszyk</a>
    </div>
    <div class="nav-cart-indicator ms-auto">
      <span class="cart-icon" aria-hidden="true">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor">
          <path d="M0 1.5A.5.5 0 0 1 .5 1h1a.5.5 0 0 1 .49.402L2.89 6H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 15H4a.5.5 0 0 1-.491-.408L1.01 2H.5a.5.5 0 0 1-.5-.5M3.102 7l1.313 7h8.17l1.313-7z"/>
        </svg>
      </span>
      <span>Koszyk</span>
      <span class="cart-count" aria-label="Liczba produktów w koszyku">0</span>
    </div>
  </div>
</nav>

  <h2>Koszyk</h2>

  <table class="card-table">
    <thead>
      <tr>
        <th>Lp</th>
        <th>Usuń</th>
        <th>Model</th>
        <th>Rozmiar</th>
        <th>Ilość</th>
        <th>Cena</th>
      </tr>
    </thead>
    <tbody id="items">
    </tbody>
    <tfooter>
      <tr>
        <td colspan="5" style="text-align: right;"><b>Razem:</b></td>
        <td><b id="total-price"></b></td>
      </tr>
    </tfooter>
  </table>

  <label class="add-discount"><input id="add-discount" type="checkbox">Zastosuj zniżkę</label>
  

  <p class="discount hidden" id="discount" data-discount-should-be-enabled="1">Zniżka: <b id="discount-amount">0</b> zł</p>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="src/js/cart.js"></script>
</body>
</html>
